name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify HTML File
        run: test -f index.html

      - name: Verify CSS File
        run: test -f style.css

      - name: Build
        run: echo "Build completed successfully!"

      - name: Test
        run: echo "All tests passed!"

      - name: Generate Logs
        run: date
